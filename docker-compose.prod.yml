# Production overrides for docker-compose.yml (variables are defined there).
services:
  strapi:
    environment:
      NODE_ENV: production
      # Behind Traefik: take client IPs (rate limit of reviews) from X-Forwarded-For
      PROXY: "true"
    restart: unless-stopped
    build:
      args:
        MODE: production
    command: "node node_modules/@strapi/strapi/bin/strapi.js start"
    networks:
      - traefik
    volumes:
      - ./backend/.tmp:/app/.tmp
      - ./backend/src:/app/src:ro
      - ./backend/config:/app/config:ro
      - ./backend/public:/app/public
      - ./backend/tmp:/tmp
      - ./backend/yarn-cache:/root/.yarn
#    depends_on:
#      - postgres

  nuxt:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    build:
      args:
        MODE: production
    command: "node .output/server/index.mjs"
    networks:
      - traefik
    volumes:
      - ./frontend/public:/app/public:ro

#volumes:
#  pgdata:

networks:
  traefik:
    external: true
