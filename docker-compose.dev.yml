  strapi:
    ports:
      - "${PORT_BACKEND:-1337}:${PORT_BACKEND:-1337}"
    command: "yarn develop"
    volumes:
      - ./backend/.tmp:/app/.tmp
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/public:/app/public
      - ./backend/tmp:/tmp
      - ./backend/yarn-cache:/root/.yarn
#    depends_on:
#      - postgres

  nuxt:
    ports:
      - "${PORT_FRONTEND:-3000}:${PORT_FRONTEND:-3000}"
    command: "yarn dev"
    volumes:
      - ./frontend/public:/app/public:ro

volumes:
  pgdata:
