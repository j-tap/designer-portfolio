# Development overrides for docker-compose.yml (variables are defined there).
services:
  strapi:
    ports:
      - "${PORT_BACKEND:-1337}:${PORT_BACKEND:-1337}"
    command: "yarn develop"
    volumes:
      - ./backend/.tmp:/app/.tmp
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/public:/app/public
      - ./backend/tmp:/tmp

  nuxt:
    ports:
      - "${PORT_FRONTEND:-3000}:${PORT_FRONTEND:-3000}"
    command: "yarn dev"
    volumes:
      # Исходники с хоста: yarn dev пересобирает страницу при каждой правке
      - ./frontend:/app
      # Зависимости и сборка — свои в контейнере: на хосте node_modules собраны под macOS.
      # Анонимные тома переживают пересоздание контейнера, поэтому make dev их обновляет
      # (--renew-anon-volumes): иначе после смены зависимостей остались бы старые
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
