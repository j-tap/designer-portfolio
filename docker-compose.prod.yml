# Production overrides for docker-compose.yml (variables are defined there).
# The start commands are the CMD of each Dockerfile.
services:
  strapi:
    environment:
      NODE_ENV: production
      # Behind Traefik: client IP (rate limit of reviews) and HTTPS come from X-Forwarded-* (config/server.js)
      PROXY: "true"
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - ./backend/.tmp:/app/.tmp
      - ./backend/src:/app/src:ro
      - ./backend/config:/app/config:ro
      - ./backend/public:/app/public
      - ./backend/tmp:/tmp

  nuxt:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - ./frontend/public:/app/public:ro

networks:
  traefik:
    external: true
