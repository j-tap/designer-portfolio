name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# The job only connects to the VPS over SSH and needs no access to the repository via GITHUB_TOKEN
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key (output of `ssh-keyscan -p <port> <host>` taken from a trusted machine)
          # protects against MITM; without the secret it falls back to trusting the key on first use.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            echo "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          fi


      - name: Pull code & rebuild containers
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin main
            make prod
          EOF
